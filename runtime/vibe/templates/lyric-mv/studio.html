<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>studio</title>
<style>
  /* local fonts only: an online font request that stalls hangs every render worker (v4 timeouts) */
  @font-face { font-family: "Permanent Marker"; src: url(assets/fonts/PermanentMarker-Regular.ttf); font-display: block; }
  @font-face { font-family: "Shantell Sans"; src: url(assets/fonts/ShantellSans-VF.ttf); font-weight: 300 800; font-display: block; }
  @font-face { font-family: "Ma Shan Zheng"; src: url(assets/fonts/MaShanZheng-Regular.ttf); font-display: block; }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/style.js"></script>   <!-- lettering preset: ./vf style <name> -->
<script src="src/config.js"></script>
<script src="src/lyrics.js"></script>
<script src="src/motion.js"></script>   <!-- EASE, tw, springAt, staggerAt, onBeat, camKeys, tempArc (kit/web) -->
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/fx.js"></script>       <!-- effects library: particles, light, camera, transitions -->
<script src="src/acting.js"></script>   <!-- body acting: anticipate, follow, reach, point, hug, sit, idle -->
<script src="src/sheets.js"></script>
<script src="src/karaoke.js"></script>
<!-- your video: one script per scene file, in order (replace demo.js) -->
<script src="src/scenes/demo.js"></script>
<script>
  // studio.html?loop=emotions (or views) scrubs a standalone loop instead of the video
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
